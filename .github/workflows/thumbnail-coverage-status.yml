name: Thumbnail Coverage Status

# Weekly coverage report — no GPU required. Posts status to tracking issue.

on:
  schedule:
    - cron: '17 9 * * 1'  # Monday 09:17 UTC (off-peak)
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number for status comment'
        required: false
        default: '921'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  coverage-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Integrity audit
        continue-on-error: true
        run: python3 scripts/audit_thumbnail_integrity.py

      - name: Coverage status
        id: status
        run: |
          npm run thumbs:status | tee /tmp/thumb-status.txt
          echo "remaining=$(grep 'remaining' /tmp/thumb-status.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Build status comment
        id: comment
        run: |
          ISSUE="${{ inputs.issue_number || '921' }}"
          FAIL_SUMMARY=""
          if [ -f reports/thumbnail-failures.json ]; then
            FAIL_SUMMARY=$(node -e "
              const fs=require('fs');
              const p='reports/thumbnail-failures.json';
              if(!fs.existsSync(p)) process.exit(0);
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              const s=j.summary||{};
              console.log('Last failure report ('+(j.generated_at||'unknown')+'): success='+ (s.success||0)+' failed='+(s.failed||0)+' black_frame='+(s.black_frame||0)+' magenta_frame='+(s.magenta_frame||0));
            ")
          fi
          INTEGRITY=""
          if [ -f reports/thumbnail_integrity_audit.json ]; then
            INTEGRITY=$(node -e "
              const j=JSON.parse(require('fs').readFileSync('reports/thumbnail_integrity_audit.json','utf8'));
              console.log('Integrity audit: scanned='+j.scanned+' flagged='+j.flagged);
            ")
          fi
          {
            echo "## Thumbnail coverage (weekly)"
            echo ""
            cat /tmp/thumb-status.txt
            echo ""
            if [ -n "$FAIL_SUMMARY" ]; then echo "$FAIL_SUMMARY"; echo ""; fi
            if [ -n "$INTEGRITY" ]; then echo "$INTEGRITY"; echo ""; fi
            echo "Run full batch on GPU: \`SKIP_WASM_BUILD=1 npm run build && bash scripts/run-thumbnail-waves.sh\`"
            echo "Docs: [THUMBNAIL_PIPELINE.md](docs/THUMBNAIL_PIPELINE.md)"
          } > /tmp/thumb-comment.md

      - name: Post issue comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE="${{ inputs.issue_number || '921' }}"
          gh issue comment "$ISSUE" --body-file /tmp/thumb-comment.md

      # The calendar half of the deferral gate. Push/PR CI runs push mode (expiry only warns),
      # so a red run here is the signal; no continue-on-error. !cancelled(): run even when the
      # coverage status step went red.
      - name: Deferral expiry gate
        id: expiry
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node scripts/verify-thumbs-deferrals.js --expiry 2>&1 | tee /tmp/deferral-expiry.txt

      # One upserted comment on the tracking issue, refreshed on green runs too so a cleared
      # cliff does not leave last week's list behind.
      - name: Sticky deferral expiry comment
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.expiry.outcome }}
        run: |
          ISSUE="${{ inputs.issue_number || '921' }}"
          MARKER="<!-- thumbnail-deferral-expiry-sticky -->"
          AFFECTED=$(node -e "
            const { loadDeferralFile, today, daysBetween, EXPIRY_WARNING_DAYS } = require('./scripts/lib/thumbnailDeferrals');
            const now = today();
            const rows = loadDeferralFile()
              .map(e => ({ ...e, exp: e.expires || e.until }))
              .filter(e => e.exp && daysBetween(now, e.exp) <= EXPIRY_WARNING_DAYS)
              .sort((a, b) => a.exp.localeCompare(b.exp) || a.id.localeCompare(b.id));
            if (!rows.length) process.exit(0);
            const cell = v => String(v ?? '').replace(/\|/g, '\\\\|').replace(/\n/g, ' ');
            console.log('| id | expires | reason | renewals | failure_note |');
            console.log('|---|---|---|---|---|');
            for (const e of rows) console.log('| \`' + e.id + '\` | ' + e.exp + (e.exp < now ? ' (expired)' : '') + ' | ' + cell(e.reason) + ' | ' + (e.renewals || 0) + ' | ' + cell(e.failure_note) + ' |');
          ")
          {
            echo "$MARKER"
            echo "## Thumbnail deferral expiry"
            echo ""
            if [ "$OUTCOME" = "success" ]; then
              echo "✅ \`verify-thumbs-deferrals --expiry\` passed ($(date -u +%F))."
            else
              echo "❌ \`verify-thumbs-deferrals --expiry\` failed ($(date -u +%F), outcome: ${OUTCOME:-unknown})."
            fi
            echo ""
            echo '```'
            cat /tmp/deferral-expiry.txt 2>/dev/null || echo "(no verifier output)"
            echo '```'
            echo ""
            if [ -n "$AFFECTED" ]; then
              echo "### Expired or expiring within 7 days"
              echo ""
              echo "$AFFECTED"
              echo ""
              echo "### Disposition"
              echo ""
              echo "Re-capture on a GPU runner (\`thumbs-capture-farm.yml\`; \`thumbs-farm-finalize.js\` drops the deferral for a clean PNG), or remove the expired rows — they then count as Missing. Do not bulk-renew."
              echo ""
              echo '```sh'
              echo 'node scripts/defer-thumbnail.js remove --expired --dry-run'
              echo 'node scripts/defer-thumbnail.js remove --expired'
              echo 'node scripts/defer-thumbnail.js ratchet'
              echo 'node scripts/check-thumbnail-coverage.js --base-ref origin/main'
              echo 'node scripts/verify-thumbs-deferrals.js --expiry'
              echo '```'
              echo ""
              echo "Before the expiry day, preview with \`THUMBS_DEFERRALS_NOW=<day after expiry>\` on the first two commands."
            else
              echo "No deferral expired or expiring within 7 days."
            fi
            echo ""
            echo "Push/PR CI runs the gate in push mode (expiry only warns). Docs: [THUMBNAIL_PIPELINE.md](docs/THUMBNAIL_PIPELINE.md)"
          } > /tmp/deferral-expiry-comment.md

          EXISTING=$(gh api --paginate "repos/${{ github.repository }}/issues/${ISSUE}/comments" \
            --jq '.[] | select(.body | contains("thumbnail-deferral-expiry-sticky")) | .id' | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -f body="$(cat /tmp/deferral-expiry-comment.md)"
          else
            gh issue comment "$ISSUE" --body-file /tmp/deferral-expiry-comment.md
          fi

      - name: Job summary
        if: always()
        run: |
          cat /tmp/thumb-status.txt >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f /tmp/deferral-expiry.txt ]; then
            { echo ""; echo "### Deferral expiry"; echo '```'; cat /tmp/deferral-expiry.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
